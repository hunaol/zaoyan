# 灶眼 AI · zaoyan.hunao.xin
# 阶段一（临时）：仅 HTTP，用于在签发证书前先验证应用本身可用。
# 证书就绪后由 zaoyan.hunao.xin.conf 替换。
server {
    listen 80;
    listen [::]:80;
    server_name zaoyan.hunao.xin;

    client_max_body_size 210m;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /www/wwwroot/zaoyan.hunao.xin;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:18088;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering on;
        # 视频分析是长任务，且上传上限 200MB，超时要放宽。
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
    }

    location ~ /\. { return 404; }

    access_log /www/wwwlogs/zaoyan.hunao.xin.log;
    error_log  /www/wwwlogs/zaoyan.hunao.xin.error.log;
}
