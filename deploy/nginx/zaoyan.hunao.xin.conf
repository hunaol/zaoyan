# 灶眼 AI · zaoyan.hunao.xin
# 宝塔 nginx 站点配置：本机容器 127.0.0.1:18088
#
# 用法（在服务器上）：
#   cp deploy/nginx/zaoyan.hunao.xin.conf /www/server/panel/vhost/nginx/
#   nginx -t && nginx -s reload
#
# 与同机既有站点（daka / love / qfnu）结构保持一致。

server {
    listen 80;
    listen [::]:80;
    server_name zaoyan.hunao.xin;

    # 证书 HTTP-01 校验走这里
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /www/wwwroot/zaoyan.hunao.xin;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known(?:/|$)) { return 404; }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name zaoyan.hunao.xin;

    ssl_certificate     /www/server/panel/vhost/cert/zaoyan.hunao.xin/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/zaoyan.hunao.xin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ZAOYAN_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 上传视频上限 200MB，比同机其他站点宽，必须显式放开。
    client_max_body_size 210m;
    client_body_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:18088;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering on;
        # 视频逐帧分析是长任务，默认 120s 会中途断开。
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
    }

    location ~ /\. { return 404; }

    access_log /www/wwwlogs/zaoyan.hunao.xin.log;
    error_log  /www/wwwlogs/zaoyan.hunao.xin.error.log;
}
