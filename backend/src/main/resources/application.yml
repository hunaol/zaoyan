server:
  port: ${PORT:8080}
  error:
    include-message: always
spring:
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/zaoyan;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
app:
  demo-username: ${DEMO_USERNAME:demo}
  demo-password: ${DEMO_PASSWORD:Demo@2026}
  operator-password: ${OPERATOR_PASSWORD:Operator@2026}
  storage-root: ${STORAGE_ROOT:./data/storage}
  python-bin: ${PYTHON_BIN:python}
  ai-root: ${AI_ROOT:../ai-engine}
  weights: ${YOLO_WEIGHTS:}
  upload-timeout-seconds: ${UPLOAD_TIMEOUT_SECONDS:300}
  max-live-sessions: ${MAX_LIVE_SESSIONS:2}
logging:
  level:
    org.hibernate.SQL: WARN
